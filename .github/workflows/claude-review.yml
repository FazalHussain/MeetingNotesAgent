name: Claude PR Review

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  claude-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude Review
        id: claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_DIFF=$(gh pr diff ${{ github.event.pull_request.number }})
          PROMPT="You are a senior Python engineer reviewing a PR.

            Review the following diff and find bugs, architecture issues, security vulnerabilities, performance problems, Python best-practice violations, async issues, and missing tests.

            For each issue provide:
            - Severity:
            - File:
            - Problem:
            - Suggested fix:

            If there are no issues, summarize the strengths.

            \`\`\`diff
            ${PR_DIFF}
            \`\`\`"

          # Run Claude Code in print mode with the PR diff
          REVIEW=$(claude --print --dangerously-skip-permissions "$PROMPT" 2>/dev/null || echo "Review failed or timed out.")

          DELIMITER=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "review<<$DELIMITER" >> $GITHUB_OUTPUT
          echo "$REVIEW" >> $GITHUB_OUTPUT
          echo "$DELIMITER" >> $GITHUB_OUTPUT

      - name: Post Review Comment
        uses: actions/github-script@v7
        env:
          REVIEW: ${{ steps.claude.outputs.review }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: process.env.REVIEW
            })